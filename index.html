<style>

 else if(t=='cactus'){const m=M(0x3c8f3c);a(new THREE.CylinderGeometry(.6,.6,5,7),m,2.5);a(new THREE.CylinderGeometry(.35,.35,1.8,6),m,3.4,1);a(new THREE.CylinderGeometry(.35,.35,1.4,6),m,2.4,-1)}
 else{const h=5+Math.random()*7;a(new THREE.BoxGeometry(1,h,1),new THREE.MeshBasicMaterial({color:[0x00e5ff,0xff2bd6,0xffee33][Math.random()*3|0]}),h/2)}
 return g}
function minD(x,z){let b=1e9;for(const p of pts){const d=(p.x-x)**2+(p.z-z)**2;if(d<b)b=d}return Math.sqrt(b)}
function buildMap(){const m=MAPS[sv.map];if(world){scene.remove(world);world.traverse(o=>{if(o.geometry)o.geometry.dispose()})}
 world=new THREE.Group();scene.add(world);scene.background.setHex(m.sky);scene.fog.color.setHex(m.sky);hemi.intensity=m.li;sun.intensity=.8*m.li;
 pts=new THREE.CatmullRomCurve3(m.cps.map(p=>new THREE.Vector3(p[0],0,p[1])),true,'centripetal').getSpacedPoints(N).slice(0,N);
 tan=pts.map((p,i)=>{const a=pts[(i+1)%N],b=pts[(i+N-1)%N];return new THREE.Vector3(a.x-b.x,0,a.z-b.z).normalize()});
 let len=0;for(let i=0;i<N;i++)len+=pts[i].distanceTo(pts[(i+1)%N]);PAR=3*len/33;
 const gnd=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),new THREE.MeshLambertMaterial({color:m.gr}));gnd.rotation.x=-Math.PI/2;world.add(gnd);
 const pos=[],col=[],idx=[],c=new THREE.Color();let n=0;
 const strip=(i,o0,o1,y,hex)=>{const j=(i+1)%N,a=pts[i],b=pts[j],ta=tan[i],tb=tan[j];c.setHex(hex);for(const[p,t,o]of[[a,ta,o0],[a,ta,o1],[b,tb,o1],[b,tb,o0]]){pos.push(p.x+t.z*o,y,p.z-t.x*o);col.push(c.r,c.g,c.b)}idx.push(n,n+1,n+2,n,n+2,n+3);n+=4};
 for(let i=0;i<N;i++){strip(i,-TW/2,TW/2,.03,m.rd[(i>>2)%2]);const k=m.kb[(i>>1)%2];strip(i,TW/2,TW/2+1.3,.04,k);strip(i,-TW/2-1.3,-TW/2,.04,k)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.setIndex(idx);
 world.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide})));
 const cv=document.createElement('canvas');cv.width=16;cv.height=2;const x=cv.getContext('2d');for(let i=0;i<16;i++)for(let j=0;j<2;j++){x.fillStyle=(i+j)%2?'#fff':'#111';x.fillRect(i,j,1,1)}
 const tx=new THREE.CanvasTexture(cv);tx.magFilter=THREE.NearestFilter;const sg=new THREE.PlaneGeometry(TW+2.6,2.4);sg.rotateX(-Math.PI/2);const sl=new THREE.Mesh(sg,new THREE.MeshBasicMaterial({map:tx}));sl.position.set(pts[0].x,.06,pts[0].z);sl.rotation.y=Math.atan2(tan[0].x,tan[0].z);world.add(sl);
 for(let i=0,k=0;i<500&&k<90;i++){const px=(Math.random()-.5)*480,pz=(Math.random()-.5)*480;if(minD(px,pz)<TW/2+8)continue;k++;const o=prop(m.pr),s=.8+Math.random()*.7;o.scale.setScalar(s);o.position.set(px,0,pz);world.add(o)}}

 const L=m=>new THREE.MeshLambertMaterial({color:m}),B=m=>new THREE.MeshBasicMaterial({color:m}),add=(w,h,l,x,y,z,m,p=b)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,l),m);o.position.set(x,y,z);p.add(o)},top=.35+d.h;

const ang=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};

function update(dt){
 const D=CARS[temp?6:sv.car],M=MAPS[sv.map],fx=Math.sin(c.th),fz=Math.cos(c.th),rx=Math.cos(c.th),rz=-Math.sin(c.th);

 const spd=Math.hypot(c.vx,c.vz);$('sp').textContent=Math.round(spd*3.6);$('dfill').style.width=c.dT/2.2*100+'%';$('dfill').style.background=c.dT>1.4?'#ff7a1a':'#ffd23f';
 $('lap').textContent='Lap '+Math.min(lap+1,3)+' / 3';$('tm').textContent=fmt(lapT);$('bt').textContent=sv.best[sv.map]?'Best lap '+fmt(sv.best[sv.map]):''}
function finish(){st='done';say('');const r=Math.round(MAPS[sv.map].rw+Math.max(0,PAR-tot)*6);sv.money+=r;save();beep(660,.5);
 $('msg').textContent=MAPS[sv.map].n+', total time '+fmt(tot)+'.';$('rw').textContent='Reward +'+r+' 🪙';$('ov').style.display='flex';$('exit').style.display='none';tbtn('none')}
function begin(){temp=0;if(sv.tok){temp=1;sv.tok=0;save()}setCar(temp?6:sv.car);reset();st='count';cd=3.99;$('lob').style.display='none';$('ov').style.display='none';$('hud').style.display='block';$('exit').style.display='block';if(touch)tbtn('flex')}
function lobby(){temp=0;st='lobby';view=sv.car;reset();setCar(view);$('lob').style.display='flex';$('ov').style.display='none';$('hud').style.display='none';$('exit').style.display='none';tbtn('none');say('');draw()}
function draw(){$('mon').textContent='🪙 '+(sv.unl?'∞':sv.money);document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 const P=$('pc');
 if(tab=='c'){const d=CARS[view],own=sv.owned.includes(view),bar=(l,v)=>'<span>'+l+'</span><div class="bar"><i style="width:'+clamp(v,6,100)+'%"></i></div>';
  P.innerHTML='<div class="row"><button class="ar" id="pv">◀</button><div class="nm">'+d.n+'</div><button class="ar" id="nx">▶</button></div><div class="st">'+bar('Speed',(d.acc-18)/18*100)+bar('Handling',(d.tn-.95)/.3*100)+bar('Boost',d.bo/18*100)+'</div><button id="act" class="'+(own||sv.unl||sv.money>=d.p?'':'no')+'">'+(own?(sv.car==view?'Selected':'Select'):'Buy for '+d.p+' 🪙')+'</button>';
  const step=s=>{do{view=(view+s+CARS.length)%CARS.length}while(CARS[view].sec&&!sv.sec);setCar(view);draw()};$('pv').onclick=()=>step(-1);$('nx').onclick=()=>step(1);
  $('act').onclick=()=>{if(own){sv.car=view}else if(sv.unl||sv.money>=d.p){if(!sv.unl)sv.money-=d.p;sv.owned.push(view);sv.car=view;beep(700,.2)}else return;save();draw()}}
 else if(tab=='k'){P.innerHTML='<div class="row"><input id="ci" placeholder="Enter code" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="ar" id="ca" style="width:auto;padding:0 18px">OK</button></div><p id="cm" style="margin:0;min-height:20px;font-size:14px;color:#ffd23f">'+(sv.tok?'Rocket is ready for your next race (one lap).':sv.unl?'Unlimited coins are on.':'')+'</p><p style="margin:0;font-size:13px;color:#c9d0ee">'+(sv.oneUsed?'Code ONELAP: already used.':'Free code: <b>ONELAP</b>. Works once, gives you Rocket for one lap.')+'</p>';
  const go=()=>{const v=$('ci').value.trim().toUpperCase();if(v=='MONEY'){sv.unl=1;save();draw();$('cm').textContent='Code accepted! You now have unlimited coins.'}else if(v=='ONELAP'){if(sv.oneUsed){$('cm').textContent='This code was already used.'}else{sv.oneUsed=1;sv.tok=1;save();draw();$('cm').textContent='Code accepted! Your next race starts with Rocket for one lap.'}}else if(v=='ROCKET'){sv.sec=1;if(!sv.owned.includes(6))sv.owned.push(6);sv.car=6;view=6;setCar(6);save();draw();$('cm').textContent='Code accepted! Secret car Rocket unlocked and selected (500 km/h).'}else $('cm').textContent='Wrong code.'};
  $('ca').onclick=go;$('ci').onkeydown=e=>{if(e.key=='Enter')go()}}
 else{P.innerHTML='<div class="mp">'+MAPS.map((m,i)=>'<button class="mc'+(i==sv.map?' on':'')+'" data-i="'+i+'"><b>'+m.n+'</b>Reward from '+m.rw+' 🪙<br>Best lap '+(sv.best[i]?fmt(sv.best[i]):'none')+'</button>').join('')+'</div>';
  P.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{sv.map=+b.dataset.i;save();buildMap();reset();draw()})}}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
$('race').onclick=()=>{view=sv.car;begin()};$('again').onclick=begin;$('tolob').onclick=lobby;$('exit').onclick=lobby;
$('rsb').onclick=()=>$('rm').style.display='flex';$('rn').onclick=()=>$('rm').style.display='none';
$('ry').onclick=()=>{sv={money:300,owned:[0],car:0,map:0,best:{}};save();tab='c';buildMap();lobby();$('rm').style.display='none'};
function hold(id,k){const e=$(id),on=v=>{tch[k]=v;e.classList.toggle('on',!!v)};e.addEventListener('pointerdown',ev=>{ev.preventDefault();on(1)});for(const t of['pointerup','pointerleave','pointercancel'])e.addEventListener(t,()=>on(0))}
hold('bl','l');hold('br','r');hold('bd','d');
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key===' ')e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function rs(){const w=innerWidth,h=innerHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
buildMap();lobby();let last=performance.now();
(function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;
 if(st=='count'){const p=Math.ceil(cd);cd-=dt;const q=Math.ceil(cd);if(cd<=0){st='race';say('GO!');beep(880,.4);setTimeout(()=>{if(st=='race')say('')},800)}else{say(q);if(q!=p)beep(440,.15)}}
 if(st!='lobby')update(dt);
 for(let i=sm.length-1;i>=0;i--){const s=sm[i];s.l-=dt;s.m.scale.multiplyScalar(1+dt*2.5);s.m.position.y+=dt;s.m.material.opacity=Math.max(0,s.l*.8);if(s.l<=0){scene.remove(s.m);sm.splice(i,1)}}
 car.position.set(c.x,0,c.z);car.rotation.y=c.th;car.userData.body.rotation.z=clamp((c.vx*Math.cos(c.th)-c.vz*Math.sin(c.th))*.012,-.2,.2);
 if(st=='lobby'){orb+=dt*.5;cam.fov=cam.aspect<1?70:50;cam.updateProjectionMatrix();cam.position.set(c.x+Math.sin(orb)*8.5,3,c.z+Math.cos(orb)*8.5);cam.lookAt(c.x,-1.4,c.z)}
 else{camA+=ang(c.th,camA)*Math.min(1,dt*3.5);const spd=Math.hypot(c.vx,c.vz),as=cam.aspect<1?1.3:1,fv=(62+Math.min(1,spd/55)*18+(c.boost>0?8:0))*as;if(Math.abs(cam.fov-fv)>.1){cam.fov+=(fv-cam.fov)*Math.min(1,dt*5);cam.updateProjectionMatrix()}
  cam.position.set(c.x-Math.sin(camA)*9,4.2,c.z-Math.cos(camA)*9);cam.lookAt(c.x+Math.sin(camA)*4,1,c.z+Math.cos(camA)*4)}
 R.render(scene,cam)})(last);
